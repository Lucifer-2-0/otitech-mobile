    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <meta name="otitech-api-base" content="https://otitech-api-prod.fly.dev/api/v1">

<body data-page="admin-login">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <main id="main-content" tabindex="-1">
        <section class="admin-login-section" aria-labelledby="login-title">
            <div class="admin-login-container">
                <div class="admin-login-brand">
                    <svg class="admin-logo" viewBox="0 0 32 32" width="48" height="48" aria-hidden="true">
                        <rect width="32" height="32" rx="8" fill="#24104f"/>
                        <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fff">OT</text>
                    </svg>
                    <h1 id="login-title">OTI-TECH Admin</h1>
                    <p>Sign in to manage your dashboard</p>
                </div>

                <form class="admin-login-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" autocomplete="email" required placeholder="admin@otitech.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn admin-login-submit">Sign In <span aria-hidden="true">&rarr;</span></button>

                    <p class="form-status" id="loginStatus" role="status" aria-live="polite"></p>
                </form>

            </div>
        </section>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
